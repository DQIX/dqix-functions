      description: |-
        Get address to inventory (bag)
        r0: getDynamicAllocatedMemIndexStartAddr
        return: 0x020F5B7C?
    - name: InitTavernParty
      address:
        jpn: 0x20107F8
        eur: 0x20109AC
        usa: 0x201099C
      description: |-
        While creating the adventure book (4th slime), consume BT to generate the initial members of Ruida's Tavern.
        I don't know about anything else.
        It is known that the processing is different between the eur version and the jpn version.
    - name: setItemPickupFountainGroup
      address:
        jpn: 0x2011E50
      description: |-
        Stores the persistent fountain group byte at dynamicBase+0x5A7A (0x020F8E52 in the Japanese version), then clears byte +0x0A of the structure returned by getItemPickupStructureAddr.
        The value is 0 through 7 for the groups ore, stone, holy water, flower, sea, grass, mushroom, and sand. Value 8 is the uninitialized sentinel before this setter runs.
        Known callers include the new-character initialization path at main:0208F364, loadItemPickupTimerSaveBlock at main:020AB760, and overlay 17 at 021B1400.
        
        r0: dynamic base returned by getDynamicAllocatedMemIndexStartAddr
        r1: fountain group byte
    - name: updateKeyInputState
      address:
        jpn: 0x2012018
      description: |-
        Updates a key-input state structure once per frame.
        The previous active-high button mask is stored at +0x02, then readKeyInputMask is called and the new mask is stored at +0x00.
        
        r0: key-input state structure
        return: void
    - name: readKeyInputMask
      address:
        jpn: 0x20120D0
      description: |-
        Reads hardware KEYINPUT at 0x04000130 and the shared key mirror at 0x027FFFA8.
        Converts the active-low values into one active-high 14-bit button mask.
        
        return: (KEYINPUT | shared key mirror) XOR 0x2FFF, masked with 0x2FFF
    - name: isButtonHeld
      address:
        jpn: 0x20121AC
      description: |-
        Tests whether any requested button bit is present in the current active-high key mask.
        
        r0: key-input state structure; current mask at +0x00
        r1: button mask
        return: bool
    - name: isButtonNewPress
      address:
        jpn: 0x20121C0
      description: |-
        Tests for a button press edge: requested in current mask and absent from previous mask.
        
        r0: key-input state structure; current mask at +0x00, previous mask at +0x02
        r1: button mask
        return: bool
    - name: isButtonReleased
      address:
        jpn: 0x20121E4
      description: |-
        Tests for a button release edge: requested absent from current mask and present in previous mask.
        
        r0: key-input state structure; current mask at +0x00, previous mask at +0x02
        r1: button mask
        return: bool
