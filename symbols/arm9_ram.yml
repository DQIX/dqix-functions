        Appends a menu-text command containing a visible row index and a string pointer to a NUL-terminated text command buffer.
        Confirmed dynamically while overlay 0 built the variable battle skill list in FUN_overlay_d_00__0217a7c0.
        The source string may contain DQ9 display markup such as [斬/ぎ].
        
        r0: NUL-terminated text command buffer
        r1: visible row index relative to the current scroll start
        r2: Shift-JIS/CP932 menu-label pointer
        return: updated byte length/offset in the command buffer
