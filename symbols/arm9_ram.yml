        jpn: 0x20CB3BC
      description: |-
        Reset the game and reload everything from the cartridge
        This function is called when the game is reset.
    - name: WhenAssertionFault
      address:
        jpn: 0x20CB6AC
      description: |-
        Causes a freeze
        
        no input
        no argument
    - name: Wait_for_interrupt
      address:
        jpn: 0x20CB6BC
      description: nope
    - name: SafeMemClear
      address:
        jpn: 0x20CC060
      description: |-
        Clears and allocates the specified number of bytes of buffer memory
        
        r0: start ptr
        r1: value
        r2: length
    - name: SafeCopyBuffer
      address:
        jpn: 0x20CC11C
      description: |-
        Overrun-safe buffer copy
        
        r0: form ptr
        r0: to ptr
        r1: length
    - name: strlenTextCommandBuffer
      address:
        jpn: 0x20D4A54
      description: |-
        Returns the byte length of a NUL-terminated string.
        Used by appendMenuTextAtRow and neighboring text-command builders to append at the current terminator.
        
        r0: NUL-terminated byte string
        return: byte length excluding the terminator
    - name: DSProtectDetectedCallbacks2
      address:
        jpn: 0x20D8614
      description: |-
        This will notify the game that the dsProtect check failed
        If the ds protect check succeeds, this function will not be called at all
        Attempting to bypass this callback function will result in an immediate crash and destroy the ds
        
        r0: is Detected
        return(s): 0x80 etc
    - name: adjustSpellMpCostForActor
      address:
        jpn: 0x20DEC0C
      description: |-
        Returns the effective spell MP cost for one battle actor.
        Normally returns the base cost unchanged. If player-data ability flag 0x106 is set, it applies the game's approximately 75 percent rounded-up cost adjustment.
        
        r0: battle actor
        r1: base MP cost from spell definition +0x08
        return: effective MP cost, or 0 for a null actor/zero cost
    - name: initMonsterData
      address:
        jpn: 0x21677AC
    - name: getBattleSpellRecord_overlay0
      address:
        jpn: 0x217305C
      description: |-
        Runtime overlay 0 function. Returns [menuData + 0xDC + index*4] for spell indexes 0..0x41, otherwise 0.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: getBattleSkillRecord_overlay0
      address:
        jpn: 0x21732EC
      description: |-
        Runtime overlay 0 function. Returns [menuData + 0x1E4 + index*4] for skill indexes 0..0x92, otherwise 0.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: getBattleItemRecord_overlay0
      address:
        jpn: 0x2173448
      description: |-
        Runtime overlay 0 function. Returns [menuData + 0x430 + index*4] for battle item/equipment indexes 0..15, otherwise 0.
        The selected signed-byte index is menuData +0x22.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: countBattleItemRecords_overlay0
      address:
        jpn: 0x217346C
      description: |-
        Runtime overlay 0 function. Counts non-null battle item/equipment records whose u16 field at record +0x18 is greater than zero.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: buildBattleItemRecordList_overlay0
      address:
        jpn: 0x21734B0
      description: |-
        Runtime overlay 0 function that builds the 16-entry pointer list at menuData +0x430.
        It appends carried-item records whose record +0x08 low nibble is greater than 7, pads the carried part to a four-row page boundary, then appends equipped-slot records derived from player data +0x194 whose low nibble is 0..7.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: prepareBattleItemSelection_overlay0
      address:
        jpn: 0x217370C
      description: |-
        Runtime overlay 0 function used after an item/equipment row is selected.
        It reads the selected record through menuData +0x430 and looks up an attack/use-effect structure using the u16 effect ID at record +0x16.
        A valid use-effect structure is routed through the normal next-command selector; a missing structure pushes fallback substate 0x0e, which is unsafe for effectless equipped rows because it consumes/skips the actor turn.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: buildBattleSpellListText_overlay0
      address:
        jpn: 0x217A384
      description: |-
        Runtime overlay 0 function. Iterates the visible spell range and appends each spell name through appendMenuTextAtRow.
    - name: buildBattleSkillListText_overlay0
      address:
        jpn: 0x217A7C0
      description: |-
        Runtime overlay 0 function. Iterates the visible skill range, emits enabled/disabled text style from the skill bitmap, and appends each skill name.
    - name: renderBattleItemMenu_overlay0
      address:
        jpn: 0x217A8D8
      description: |-
        Runtime overlay 0 renderer for battle menu substate 0x11.
        Builds the four-visible-row item/equipment menu and calls buildBattleItemListText_overlay0.
    - name: buildBattleItemListText_overlay0
      address:
        jpn: 0x217AB5C
      description: |-
        Runtime overlay 0 visible-row builder for the item/equipment list.
        Reads rows through getBattleItemRecord_overlay0 and appends the label pointer at record +0x04.
        Record +0x08 low nibble 8 is a carried-item slot; values 0..7 are equipped slots.
        Equipment is selectable only when it has a live in-battle use effect. The supplied state has none; selecting an effectless equipped row consumes/skips the actor turn.
    - name: renderBattleCoupMenu_overlay0
      address:
        jpn: 0x217AEF8
      description: |-
        Runtime overlay 0 renderer for the one-row coup-de-grace intermediate menu at substate 0x15.
        This screen requires a second A confirmation after choosing ひっさつ at the action root.
    - name: buildBattleCoupListText_overlay0
      address:
        jpn: 0x217B24C
      description: |-
        Runtime overlay 0 coup-de-grace row builder.
        Uses the selected index at menuData +0x23 and emits the current actor's coup label.
    - name: prepareBattleSkillSelection_overlay0
      address:
        jpn: 0x21730B8
      description: |-
        Runtime overlay 0 function used after a skill has been selected.
        Reads the selected skill record's base MP cost at +0x08, applies adjustSpellMpCostForActor, and compares the effective cost with the current battle-menu MP value at menu data +0x0e.
        Sufficient MP advances to the next command substate; insufficient MP selects the failure substate 0x1a instead.
        This address is valid only while overlay slot 0 contains the battle overlay; identify overlays by content before reusing it in another scene.
    - name: confirmBattleSkillSelection_overlay0
      address:
        jpn: 0x217CA24
      description: |-
        Runtime overlay 0 function. Rechecks isBattleSkillEnabled for the selected absolute index.
        A zero bit leaves the submenu state unchanged; a set bit advances the selected skill command path.
    - name: confirmBattleItemSelection_overlay0
      address:
        jpn: 0x217CBF8
      description: |-
        Runtime overlay 0 item-menu A-button handler.
        It validates the selected record, stores record +0x18 into menuData +0x2c, and calls prepareBattleItemSelection_overlay0.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: syncBattleVariableMenuCursor_overlay0
      address:
        jpn: 0x217D4AC
      description: |-
        Runtime overlay 0 cursor synchronizer used by the spell, skill, and item variable menus.
        It copies the active menu object's absolute selection back to the category-specific selected field in menuData.
        Valid only while battle overlay 0 is loaded at its Japanese runtime address.
    - name: buildBattleSkillEnabledBitmap_overlay0
      address:
        jpn: 0x217D680
      description: |-
        Runtime overlay 0 function. Clears menuData +0xC8 for 0x13 bytes, then sets one bit per skill whose required weapon category matches the actor's allowed primary/secondary equipment category or another explicitly allowed requirement.
    - name: isBattleSkillEnabled_overlay0
      address:
        jpn: 0x217D83C
      description: |-
        Runtime overlay 0 function. Tests bit index&7 at menuData +0xC8 + (index>>3).
        Used by both skill-list text styling and A-button confirmation gating.
    - name: candidate_loadNitroFsFileToBuffer
      address:
        jpn: 0x2076224
      description: |-
        Confidence: candidate (static decompile and file-path callers only).
        Opens the NitroFS path in r0 and reads it into the buffer in r1. Writes the loaded byte length through r2 when r2 is non-null. Returns r1 on success and 0 on failure.
        Callers at 0x0209C09C and 0x0209C130 pass data/prm/skilltable.bin and the shared buffer at 0x0211FB64.
    - name: candidate_loadPackedRecordTable34
      address:
        jpn: 0x207A8E8
      description: |-
        Confidence: candidate (static decompile plus the independently observed 0x34-byte skill-definition stride).
        Builds an owned table from the packed blob in r2. The low 12 bits of the first u32 are the record count; records have stride 0x34. r0 is the destination table object, r1 is the allocator/context, and r3 is an optional per-record callback. Returns 1 on success and 0 for null inputs.
    - name: candidate_loadPackedRecordTable08
      address:
        jpn: 0x207AA2C
      description: |-
        Confidence: candidate (static decompile only).
        Companion packed-table loader using 8-byte records. The low 12 bits of the first u32 are the record count. r0 is the destination table object, r1 is the allocator/context, r2 is the packed blob, and r3 is an optional per-record callback. Returns 1 on success and 0 for null inputs.
    - name: candidate_loadBattleActionData
      address:
        jpn: 0x207AB68
      description: |-
        Confidence: supported for file ownership, candidate for detailed types.
        Loads data/prm/actdata_b.gp2 through the local file/archive layer, extracts two named members, and passes them to candidate_loadPackedRecordTable34 at r0+0x0C and candidate_loadPackedRecordTable08 at r0+0x24.
        r0 is the destination battle-action data owner and r1 is the allocator/context. Static filename xref: data/prm/actdata_b.gp2 at 0x020F0EC9.
    - name: candidate_relocatePackedRecordName
      address:
        jpn: 0x207A6FC
      description: |-
        Confidence: supported by ARM listing and exact ROM table reconstruction.
        Per-record callback used by candidate_loadPackedRecordTable34. r0 is the table object and r1 is the current 0x34-byte record. It replaces record +0x00 with table string-pool pointer at r0+0x08 plus the raw pool-relative offset; raw -1 becomes null.
        The next field, record +0x04, begins with the little-endian u16 internal action/skill ID.
    - name: getPackedRecordTable34ByteLength
      address:
        jpn: 0x207AA14
      description: |-
        Returns `(header & 0xFFF) * 0x34`, the byte length of the fixed records in the battle-action table object passed in r0.
    - name: getPackedRecordTable08ByteLength
      address:
        jpn: 0x207AB58
      description: |-
        Returns `(header & 0xFFF) * 8`, the byte length of the companion packed record table passed in r0.
  data:
    - name: AT_LCG_Location
      address:
        jpn: 0x20EEE90
        eur: 0x20EEF30
        usa: 0x20EEF30
      length:
        jpn: 0x4
        eur: 0x4
    - name: FirstPartyMemberPlayerData
      address:
        jpn: 0x20F52B0
      length:
        jpn: 0x878
      description: |-
        Runtime player-data structure for party member 1 in the supplied Japanese battle state.
        The current battle actor resolves this pointer through battle actor +0x144 (getBattleActorPlayerData).
        Confirmed fields include u16 +0x1c current HP, u16 +0x1e current MP, +0x488 equipment state, and ability flags through at least +0x874.
        The length is the minimum observed span needed to include +0x874; it is not a confirmed complete structure size.
    - name: FirstPartyMemberCurrentHpMp
      address:
        jpn: 0x20F52CC
      length:
        jpn: 0x4
      description: |-
        Contiguous current HP/MP pair for party member 1 in the Japanese player-data structure.
        u16 +0x00 is current HP and u16 +0x02 is current MP.
        Runtime values in the supplied battle-start state were HP 297 and MP 155; casting ホイミ changed MP to 153.
    - name: FirstPartyMemberCoupCharge
      address:
        jpn: 0x20F537F
      length:
        jpn: 0x1
      description: |-
        Battle coup-de-grace charge byte for party member 1.
        Writing 0x78, equivalent to Action Replay code 220F537F 00000078, makes the Japanese battle command ひっさつ available and glowing.
    - name: ItemPickupGlobalTimerTable
      address:
        jpn: 0x20F8E54
      length:
        jpn: 0x190
      description: |-
        Sparse 100-entry u32 pickup timer table addressed as base+areaIndex*4.
        Low 9 bits are remaining counts and one count is 60.0 game seconds. For example, area 5 is 0x020F8E68 and reloads to 30; area 18 is 0x020F8E9C and reloads to 360.
    - name: BT_LCG_location
      address:
        jpn: 0x2108D20
        eur: 0x2108DDC
        usa: 0x2108DDC
      length:
        jpn: 0x8
        eur: 0x8
    - name: ItemPickupStructure
      address:
        jpn: 0x2108F28
      length:
        jpn: 0x10
      description: Pickup-chain owner returned by getItemPickupStructureAddr. Pointer +0x04 is the first 0x70-byte pickup node and the node next pointer is at +0x6C.
    - name: ItemPickupModeDefaults
      address:
        jpn: 0x2108F38
      length:
        jpn: 0x20
      description: |-
        Eight four-byte records selected from fldbias.bin. Each record is u16 respawn count, u8 respawn group, u8 point count.
        For Japanese selector 3, mode 0 is 360/1/3 and mode 3 is 180/5/6.
    - name: ItemPickupRespawnScheduler
      address:
        jpn: 0x2108F64
      length:
        jpn: 0x8
      description: |-
        Shared scheduler used by updateItemPickupRespawnTimers.
        Byte +0 is the current area index in the 0..99 timer sweep and float +0x04 is elapsed seconds toward the 60.0-second threshold. Pickup collection does not reset either field.
    - name: CT_LCG_location
      address:
        jpn: 0x2385F0C
        eur: 0x2388B9C
        usa: 0x2388B9C
      length:
        jpn: 0x8
        eur: 0x8
    - name: BattleMenuSubstateStack
      address:
        jpn: 0x2392E44
      length:
        jpn: 0x9
      description: |-
        Battle menu substate byte stack at menu data +0x10 followed by its index byte at +0x18.
        Runtime-confirmed values include 0x0d action root, 0x0f spell list, 0x10 skill list, 0x15 coup-de-grace intermediate confirmation, and 0x64 queued/target-or-action continuation.
        On the 0x15 coup screen, B returns to substate 0x0d; a second A after a fully released input interval advances to 0x64 and BattleScreenState 8/3.
    - name: BattleScreenState
      address:
        jpn: 0x238FBE4
      length:
        jpn: 0x8
      description: |-
        Two-word battle screen/progression state, dynamically verified across one complete ホイミ action.
        Word +0x00 was 7 for top/action/skill/spell selection screens, 0x13 for target selection, and 8 during queued action/animation.
        Word +0x04 was 4 on selection screens, 0 for target selection, and changed among 1, 2, 3, and 6 during animation.
        The next selectable turn returned to 7/4. Pair this with battle owner state-stack state 1 before declaring the next top menu ready.
